# ==============================================================================
# Logimax DevTools — Docker Compose (Production-Ready)
# ==============================================================================
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f        # tail logs
#   docker compose down           # stop
#   docker compose up --build -d  # rebuild & start
#
# Dev override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ==============================================================================

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devtools-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devtools-backend
    restart: unless-stopped
    ports:
      - "8800:8800"
    environment:
      # App
      DEVTOOLS_APP_VERSION: "1.0.0"
      DEVTOOLS_DEBUG: "false"
      DEVTOOLS_API_VERSION: "v1"

      # Security — uncomment and set a real key in production
      # DEVTOOLS_API_KEY: "change-me-in-production"

      # Paths — codebase mounted as volume
      DEVTOOLS_ETAIL_ROOT: "/codebase"
      DEVTOOLS_LOGS_PATH: "/codebase/admin/logs"

      # CORS
      DEVTOOLS_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'

      # Database — persist in named volume
      DEVTOOLS_DATABASE_URL: "sqlite+aiosqlite:///data/devtools.db"
    volumes:
      # Mount etail codebase (read-only for safety)
      - type: bind
        source: ../
        target: /codebase
        read_only: true

      # Persistent data (databases, indexes)
      - devtools-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  devtools-data:
    driver: local
