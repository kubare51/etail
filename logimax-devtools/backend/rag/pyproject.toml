[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logimax-rag"
version = "0.1.0"
description = "RAG pipeline for CodeIgniter 3 ERP codebases — smart chunking, enrichment, and vector search"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "chromadb>=0.4.0",
]

[project.scripts]
rag = "rag.cli:app"

[tool.setuptools.packages.find]
where = ["."]
