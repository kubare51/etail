[project]
name = "logimax-devtools-backend"
version = "1.0.0"
description = "Backend API for Logimax DevTools"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "websockets>=12.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.26.0",
    "openai>=1.0.0",
    "mcp>=1.26.0",
    "logimax-code-analyzer",
]

[tool.uv.sources]
logimax-code-analyzer = { path = "lca_core", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[project.scripts]
logimax-devtools = "mcp_server:run_server"
command-center = "command_center.mcp_server:run_server"
devtools = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "command_center", "cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
