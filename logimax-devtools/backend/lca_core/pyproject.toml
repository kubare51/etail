[project]
name = "logimax-code-analyzer"
version = "0.1.0"
description = "Impact analysis engine for Logimax"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "networkx>=3.1",
    "tree-sitter>=0.20.0",
    "tree-sitter-javascript>=0.20.0",
    "tree-sitter-php>=0.20.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.0",
    "mcp>=1.26.0",
    "watchdog>=4.0.0",
    "tree-sitter-python>=0.25.0",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-watch>=4.2.0",
    "mutmut>=3.0.0",
]
semantic = [
    "chromadb>=1.0.0",
    "sentence-transformers>=2.2.0",
]

[project.scripts]
lca = "lca.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lca"]
