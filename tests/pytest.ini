[pytest]
testpaths = tests/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --timeout=120
    --junitxml=tests/reports/junit.xml
    --html=tests/reports/report.html
    --self-contained-html
markers =
    smoke: Quick smoke tests (login, dashboard)
    p0: Priority 0 — critical business flows
    p1: Priority 1 — important modules
    p2: Priority 2 — secondary modules
    p3: Priority 3 — supplementary/edge-case coverage
    masters: Master data tests
    billing: Billing module tests
    estimation: Estimation module tests
    purchase: Purchase module tests
    inventory: Inventory module tests
    customer: Customer module tests
    repair: Repair order tests

[tool:pytest]
log_cli = true
log_cli_level = INFO
