# ============================================================
# Validation & Transformation Rules for Migration Tool
# ============================================================
# Notes:
# - transform:
#     upper       → convert to UPPERCASE
#     lower       → convert to lowercase
#     title_case  → Convert To Title Case
# - cast:
#     int, float, str → force type conversion
# - mode:
#     lenient → allow UPSERT (ON DUPLICATE KEY UPDATE)
#     strict  → insert only, reject duplicates
# ============================================================

# ============================================================
# Migration Rules with Lookups, Validations & Defaults
# ============================================================

category:
  target_table: ret_category
  primary_key: id_ret_category
  mode: strict
  reload: false
  mapping:
    id_ret_category: id_ret_category
    category_name: name
    hsn_code: hsn_code
    short_code: cat_code
    category_type: cat_type
    description: description
  lookups:
    id_metal:
      source: metal_id
      ref_table: metal
      ref_key: id_metal
      ref_value: id_metal
      fallback:
        source: metal_name
        ref_table: metal
        ref_key: metal
        ref_value: id_metal
    tgrp_id:
      source: tax_group_id
      ref_table: ret_taxgroupmaster
      ref_key: tgrp_id
      ref_value: tgrp_id
      fallback:
        source: tax_group
        ref_table: ret_taxgroupmaster
        ref_key: tgrp_name
        ref_value: tgrp_id
  defaults:
    status: 1
    is_multimetal: 0
    is_multi_metal_cateory: 0
    tally_qty_type: 0
    scheme_closure_benefit: 1
    is_916: 1
    created_on: now
    created_by: 1
  validation:
    category_name:
      required: true
      unique: true
    hsn_code:
      validate:
        regex: "^[0-9]{4,8}$"
  transformation:
    category_name:
      transform: upper
      cast: str
    hsn_code:
      cast: str

product:
  target_table: ret_product_master
  primary_key: pro_id
  mode: strict
  reload: false
  depends_on: [category]
  mapping:
    product_id: pro_id
    product_name: product_name
    short_code: product_short_code
    hsn_code: hsn_code
    description: description
    status: product_status
    
  lookups:
    cat_id:
      source: category_id
      ref_table: ret_category
      ref_key: id_ret_category
      ref_value: id_ret_category
      fallback:
        source: category_name
        ref_table: ret_category
        ref_key: name
        ref_value: id_ret_category
    metal_type:
      source: metal_id
      ref_table: metal
      ref_key: id_metal
      ref_value: id_metal
      fallback:
        source: metal_name
        ref_table: metal
        ref_key: metal
        ref_value: id_metal
    tgrp_id:
      source: tax_group_id
      ref_table: ret_taxgroupmaster
      ref_key: tgrp_id
      ref_value: tgrp_id
      fallback:
        source: tax_group
        ref_table: ret_taxgroupmaster
        ref_key: tgrp_name
        ref_value: tgrp_id
  defaults:
    product_status: 1
    image: null
    created_on: now
    created_by: 1
    stock_type: 1
    stone_type: 0
    sales_mode: 2
    purchase_mode: 2
    disc_type: 1
    wastage_type: 2
    calculation_based_on: 1
    tax_group_id: 1
    tax_type: 2
    reorder_based_on: 1
    purchase_tax_type: 2
    gift_applicable: 0
    display_purity: 1
  validation:
    product_name:
      required: true
      unique: true
    product_status:
      validate:
        in: [0, 1]
  transformation:
    product_name:
      transform: upper
    product_status:
      default: 1
      cast: int

design_master:
  target_table: ret_design_master
  primary_key: design_no
  mode: strict
  reload: false
  mapping:
    design_id: design_no
    design_name: design_name
    short_code: design_code
  defaults:
    design_status: 1
    created_on: now
    created_by: 1
    mc_cal_type: 1
    mc_cal_value: 0.00
    wastage_type: 1
    wastag_value: 0.00
  validation:
    design_name:
      required: true
      unique: true
  transformation:
    design_name:
      transform: upper

sub_design_master:
  target_table: ret_sub_design_master
  primary_key: id_sub_design
  mode: strict
  reload: false
  mapping:
    sub_design_id: id_sub_design
    sub_design_name: sub_design_name
    short_code: sub_design_code
  defaults:
    status: 1
    created_on: now
    created_by: 1
  validation:
    sub_design_name:
      required: true
      unique: true
    status:
      validate:
        in: [0, 1]
  transformation:
    sub_design_name:
      transform: upper
    status:
      default: 1
      cast: int

product_mapping:
  target_table: ret_product_mapping
  mode: strict
  reload: false
  depends_on: [product, design_master]
  mapping: {}   # no direct mapping, only lookups used
  lookups:
    pro_id:
      source: product_id
      ref_table: ret_product_master
      ref_key: pro_id
      ref_value: pro_id
      fallback:
        source: product_name
        ref_table: ret_product_master
        ref_key: product_name
        ref_value: pro_id
    id_design:
      source: design_id
      ref_table: ret_design_master
      ref_key: design_no
      ref_value: design_no
      fallback:
        source: design_name
        ref_table: ret_design_master
        ref_key: design_name
        ref_value: design_no
  defaults: {}
  validation:
    product_id:
      required: false
    product_name:
      required: true
    design_id:
      required: false
    design_name:
      required: true


sub_design_mapping:
  target_table: ret_sub_design_mapping
  mode: strict
  reload: false
  depends_on: [product, design_master, sub_design_master]
  mapping: {}
  lookups:
    id_product:
      source: product_id
      ref_table: ret_product_master
      ref_key: pro_id
      ref_value: pro_id
      fallback:
        source: product_name
        ref_table: ret_product_master
        ref_key: product_name
        ref_value: pro_id
    id_design:
      source: design_id
      ref_table: ret_design_master
      ref_key: design_no
      ref_value: design_no
      fallback:
        source: design_name
        ref_table: ret_design_master
        ref_key: design_name
        ref_value: design_no
    id_sub_design:
      source: sub_design_id
      ref_table: ret_sub_design_master
      ref_key: id_sub_design
      ref_value: id_sub_design
      fallback:
        source: sub_design_name
        ref_table: ret_sub_design_master
        ref_key: sub_design_name
        ref_value: id_sub_design
  defaults:
    mc_cal_type: 2
    mc_cal_value: 0.0
    wastage_type: 1
    wastag_value: 0.0
  validation:
    product_id:
      required: false
    product_name:
      required: true
    design_id:
      required: false
    design_name:
      required: true
    sub_design_id:
      required: false
    sub_design_name:
      required: true
    mc_cal_type:
      validate:
        in: [1, 2]


section:
  target_table: ret_section
  primary_key: id_section
  mode: strict
  reload: false
  mapping:
    id_section: id_section
    section_name: section_name
    short_code: section_short_code
    is_home_bill_counter: is_home_bill_counter
  defaults:
    status: 1
    created_by: 1
    date_add: now
  validation:
    section_name:
      required: true
    section_short_code:
      required: false
    status:
      validate:
        in: [0, 1]
  transformation:
    section_name:
      transform: upper
    section_short_code:
      transform: upper
    status:
      transform: map
      mapping:
        'YES': 1
        'NO': 0
      default: 1
      cast: int
    is_home_bill_counter:
      transform: map
      mapping:
        'YES': 1
        'NO': 0
      default: 0
      cast: int

product_section:
  target_table: ret_product_section
  mode: strict
  reload: false
  depends_on: [product, section]
  mapping: {}
  lookups:
    pro_id:
      source: product_id
      ref_table: ret_product_master
      ref_key: pro_id
      ref_value: pro_id
      fallback:
        source: product_name
        ref_table: ret_product_master
        ref_key: product_name
        ref_value: pro_id
    id_section:
      source: section_id
      ref_table: ret_section
      ref_key: id_section
      ref_value: id_section
      fallback:
        source: section_name
        ref_table: ret_section
        ref_key: section_name
        ref_value: id_section
  defaults: {}
  validation:
    product_id:
      required: false
    product_name:
      required: true
    section_id:
      required: false
    section_name:
      required: true


