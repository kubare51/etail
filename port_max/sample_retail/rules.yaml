karigar:
  target_table: ret_karigar
  primary_key: id_karigar
  mode: strict
  reload: false
  mapping:
    id_karigar: id_karigar
    karigar_type: karigar_type
    first_name: firstname
    last_name: lastname
    company_name: company
    short_code: code_karigar
    mobile: contactno1
    address1: address1
    address2: address2
    address3: address3
    country_id: id_country
    state_id: id_state
    city_id: id_city
    is_tcs: is_tcs
    is_tds: is_tds
    fin_year_code: fin_year_code
    opening_amount: opening_balance_amount
  lookups:
    id_country:
      source: id_country
      ref_table: country
      ref_key: id_country
      ref_value: id_country
      fallback:
        source: country_name
        ref_table: country
        ref_key: name
        ref_value: id_country
    id_state:
      source: id_state
      ref_table: state
      ref_key: id_state
      ref_value: id_state
      fallback:
        source: state_name
        ref_table: state
        ref_key: name
        ref_value: id_state
    id_city:
      source: id_city
      ref_table: city
      ref_key: id_city
      ref_value: id_city
      fallback:
        source: city_name
        ref_table: city
        ref_key: name
        ref_value: id_city
  defaults:
    status_karigar: 1
    createdon: now
    createdby: 1
    id_country: 101
    id_state: 35
    id_city: 3659
    karigar_for: 1
    is_tcs: 0
    tcs_tax: 0.000
    is_tds: 1
    tds_tax: 0.100
    owner_account: 0
  validation:
    first_name:
      required: true
    mobile:
      required: false
      validate:
        regex: "^[0-9]{10}$"
    gst_number:
      required: false
      validate:
        regex: "^[0-9A-Z]{15}$"
  transformation:
    first_name:
      transform: upper
    last_name:
      transform: upper
    company_name:
      transform: upper
    karigar_type:
      cast: int
    is_tcs:
      transform: map
      mapping:
        'YES': 1
        'NO': 0
      default: 0
      cast: int
    is_tds:
      transform: map
      mapping:
        'YES': 1
        'NO': 0
      default: 1
      cast: int

