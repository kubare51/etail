      ref_table: ret_karigar
      ref_key: id_karigar
      ref_value: id_karigar
      fallback:
        source: karigar_name
        ref_table: ret_karigar
        ref_key: firstname
        ref_value: id_karigar
  defaults:
    status: 1
    created_on: now
    created_by: 1
    mc_type: 1
