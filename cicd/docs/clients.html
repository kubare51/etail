<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients | Logimax CI/CD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/dashboard-extra.css">
    <script src="js/auth-check.js" data-require-role="admin"></script>
    <script src="js/toast.js"></script>
    <style>
        .app-layout {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px;
            margin-bottom: 32px;
            font-weight: 700;
            font-size: 18px;
        }
        
        .sidebar-logo svg {
            width: 32px;
            height: 32px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 4px;
        }
        
        .nav-item:hover {
            background: rgba(0,0,0,0.03);
        }
        
        .nav-item.active {
            background: var(--accent);
            color: white;
        }
        
        .nav-item svg {
            width: 20px;
            height: 20px;
        }
        
        .main-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .page-title h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .page-title p {
            color: var(--text-muted);
            font-size: 14px;
        }
        
        .search-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .search-box input {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            width: 300px;
        }
        
        .clients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        
        .client-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .client-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        
        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        
        .client-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .client-team {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 20px;
            background: rgba(0,0,0,0.05);
            color: var(--text-muted);
        }
        
        .client-team.logimax-clients { background: #dcfce7; color: #166534; }
        .client-team.logimax-tech { background: #dbeafe; color: #1e40af; }
        
        .client-repo {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            word-break: break-all;
        }
        
        .client-actions {
            display: flex;
            gap: 8px;
        }
        
        .client-actions .btn {
            flex: 1;
            padding: 10px;
            font-size: 13px;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }
        
        @media (max-width: 1024px) {
            .sidebar { display: none; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }
        
        @media (max-width: 640px) {
            .clients-grid { grid-template-columns: 1fr; }
            .search-box input { width: 200px; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 8L16 4L24 8V16L16 20L8 16V8Z"/>
                    <path d="M8 16L16 20L24 16V24L16 28L8 24V16Z"/>
                </svg>
                Logimax
            </div>
            
            <nav>
                <a href="index.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>
                    Dashboard
                </a>
                <a href="support-deploy.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                    Deployments
                </a>
                <a href="clients.html" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    Clients
                </a>
                <a href="client-setup-wizard.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                    Add New Client
                </a>
            </nav>
        </aside>
        
        <main class="main-content">
            <div class="page-header">
                <div class="page-title">
                    <h1>Clients</h1>
                    <p>Manage all client repositories and configurations</p>
                </div>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search clients..." oninput="filterClients(this.value)">
                    <a href="client-setup-wizard.html" class="btn btn-primary">+ Add Client</a>
                </div>
            </div>
            
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-number" id="total-clients">0</div>
                    <div class="stat-label">Total Clients</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="logimax-clients-count">0</div>
                    <div class="stat-label">LOGIMAX-CLIENTS</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="logimax-tech-count">0</div>
                    <div class="stat-label">Logimax-Technologies</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="active-count">0</div>
                    <div class="stat-label">Active</div>
                </div>
            </div>
            
            <div class="clients-grid" id="clients-grid">
                <div class="empty-state">
                    <div style="font-size: 48px; margin-bottom: 16px;">📦</div>
                    <h3>Loading clients...</h3>
                </div>
            </div>
        </main>
    </div>

<script>
let allClients = [];

async function loadClients() {
    try {
        const res = await fetch('../../clients/registry.json');
        const data = await res.json();
        allClients = data.clients || [];
        
        // Update stats
        document.getElementById('total-clients').textContent = allClients.length;
        document.getElementById('logimax-clients-count').textContent = 
            allClients.filter(c => c.team === 'LOGIMAX-CLIENTS').length;
        document.getElementById('logimax-tech-count').textContent = 
            allClients.filter(c => c.team === 'Logimax-Technologies').length;
        document.getElementById('active-count').textContent = allClients.length;
        
        renderClients(allClients);
    } catch(e) {
        console.error('Failed to load clients:', e);
        Toast.error('Load Error', 'Failed to load clients registry');
        document.getElementById('clients-grid').innerHTML = `
            <div class="empty-state">
                <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
                <h3>Failed to load clients</h3>
                <p>Please check if registry.json exists</p>
            </div>`;
    }
}

function renderClients(clients) {
    const grid = document.getElementById('clients-grid');
    
    if (clients.length === 0) {
        grid.innerHTML = `
            <div class="empty-state">
                <div style="font-size: 48px; margin-bottom: 16px;">🔍</div>
                <h3>No clients found</h3>
                <p>Try a different search term</p>
            </div>`;
        return;
    }
    
    grid.innerHTML = clients.map(client => `
        <div class="client-card" onclick="viewClient('${client.repo}')">
            <div class="client-header">
                <div class="client-name">${client.name}</div>
                <span class="client-team ${client.team === 'LOGIMAX-CLIENTS' ? 'logimax-clients' : 'logimax-tech'}">
                    ${client.team}
                </span>
            </div>
            <div class="client-repo">${client.repo}</div>
            <div class="client-actions">
                <button class="btn btn-secondary" onclick="event.stopPropagation(); syncClient('${client.repo}')">
                    Sync
                </button>
                <button class="btn btn-primary" onclick="event.stopPropagation(); configureClient('${client.repo}')">
                    Configure
                </button>
            </div>
        </div>
    `).join('');
}

function filterClients(query) {
    if (!query) {
        renderClients(allClients);
        return;
    }
    
    const filtered = allClients.filter(c => 
        c.name.toLowerCase().includes(query.toLowerCase()) ||
        c.repo.toLowerCase().includes(query.toLowerCase()) ||
        c.team.toLowerCase().includes(query.toLowerCase())
    );
    renderClients(filtered);
}

function viewClient(repo) {
    const client = allClients.find(c => c.repo === repo);
    if (client) {
        showClientModal(client);
    }
}

function showClientModal(client) {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay active';
    modal.innerHTML = `
        <div class="modal-container">
            <div class="modal-header">
                <h3>${client.name}</h3>
                <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
            </div>
            <div style="padding: 24px;">
                <div style="margin-bottom: 16px;">
                    <strong>Repository:</strong><br>
                    <a href="https://github.com/${client.team}/${client.repo}" target="_blank">${client.repo}</a>
                </div>
                <div style="margin-bottom: 16px;">
                    <strong>Team:</strong> ${client.team}
                </div>
                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button class="btn btn-secondary" style="flex:1" onclick="this.closest('.modal-overlay').remove()">Close</button>
                    <button class="btn btn-primary" style="flex:1" onclick="configureClient('${client.repo}')">Configure</button>
                </div>
            </div>
        </div>`;
    document.body.appendChild(modal);
}

function syncClient(repo) {
    Toast.info('Sync Triggered', `Syncing ${repo}... (This would trigger the GitHub workflow)`);
}

function configureClient(repo) {
    window.location.href = `client-setup-wizard.html?client=${encodeURIComponent(repo)}`;
}

document.addEventListener('DOMContentLoaded', loadClients);
</script>
</body>
</html>
