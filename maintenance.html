<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We'll Be Right Back — Scheduled Maintenance</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: #fff;
            padding: 20px;
            overflow: hidden;
        }

        /* ── Animated background particles ─────────────────────── */
        .bg-particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Generate particles with CSS */
        .particle:nth-child(1)  { left: 5%;  animation-duration: 8s;  animation-delay: 0s; }
        .particle:nth-child(2)  { left: 15%; animation-duration: 12s; animation-delay: 1s; }
        .particle:nth-child(3)  { left: 25%; animation-duration: 9s;  animation-delay: 2s; }
        .particle:nth-child(4)  { left: 35%; animation-duration: 11s; animation-delay: 0.5s; }
        .particle:nth-child(5)  { left: 45%; animation-duration: 10s; animation-delay: 3s; }
        .particle:nth-child(6)  { left: 55%; animation-duration: 7s;  animation-delay: 1.5s; }
        .particle:nth-child(7)  { left: 65%; animation-duration: 13s; animation-delay: 2.5s; }
        .particle:nth-child(8)  { left: 75%; animation-duration: 8s;  animation-delay: 4s; }
        .particle:nth-child(9)  { left: 85%; animation-duration: 11s; animation-delay: 0.8s; }
        .particle:nth-child(10) { left: 95%; animation-duration: 9s;  animation-delay: 3.5s; }
        .particle:nth-child(11) { left: 10%; animation-duration: 14s; animation-delay: 5s; width: 3px; height: 3px; }
        .particle:nth-child(12) { left: 30%; animation-duration: 10s; animation-delay: 6s; }
        .particle:nth-child(13) { left: 50%; animation-duration: 8s;  animation-delay: 1.2s; width: 3px; height: 3px; }
        .particle:nth-child(14) { left: 70%; animation-duration: 12s; animation-delay: 4.5s; }
        .particle:nth-child(15) { left: 90%; animation-duration: 9s;  animation-delay: 2.8s; width: 3px; height: 3px; }

        /* ── Main container ─────────────────────────────────────── */
        .container {
            text-align: center;
            max-width: 580px;
            position: relative;
            z-index: 1;
        }

        /* ── Diamond icon ──────────────────────────────────────── */
        .diamond-container {
            margin-bottom: 40px;
            position: relative;
            display: inline-block;
        }

        .diamond-svg {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
            animation: diamond-glow 3s ease-in-out infinite;
        }

        @keyframes diamond-glow {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.3));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 35px rgba(212, 175, 55, 0.6))
                        drop-shadow(0 0 60px rgba(212, 175, 55, 0.2));
                transform: scale(1.05);
            }
        }

        /* ── Ornamental divider ────────────────────────────────── */
        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 24px 0;
        }

        .ornament-line {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
        }

        .ornament-dot {
            width: 5px;
            height: 5px;
            background: #d4af37;
            transform: rotate(45deg);
        }

        /* ── Typography ────────────────────────────────────────── */
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #d4af37 0%, #f5e6a3 40%, #d4af37 60%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1rem;
            color: #8a7a5a;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 400;
        }

        p.message {
            font-size: 1.05rem;
            color: #9a9a9a;
            line-height: 1.7;
            margin-bottom: 32px;
            font-weight: 300;
        }

        /* ── Progress indicator ────────────────────────────────── */
        .progress-container {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 14px 28px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        .progress-dots {
            display: flex;
            gap: 6px;
        }

        .progress-dot {
            width: 6px;
            height: 6px;
            background: #d4af37;
            border-radius: 50%;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        .progress-dot:nth-child(2) { animation-delay: 0.3s; }
        .progress-dot:nth-child(3) { animation-delay: 0.6s; }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50%      { opacity: 1;   transform: scale(1.2); }
        }

        .progress-text {
            font-size: 0.85rem;
            color: #c9b06b;
            letter-spacing: 0.05em;
        }

        /* ── Footer ────────────────────────────────────────────── */
        .footer {
            margin-top: 50px;
            color: #4a4a4a;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        .footer a {
            color: #8a7a5a;
            text-decoration: none;
            border-bottom: 1px solid rgba(138, 122, 90, 0.3);
            transition: color 0.3s, border-color 0.3s;
        }

        .footer a:hover {
            color: #d4af37;
            border-color: #d4af37;
        }

        /* ── Responsive ────────────────────────────────────────── */
        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            .subtitle { font-size: 0.85rem; }
            p.message { font-size: 0.95rem; }
            .diamond-svg { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
    <!-- Background sparkle particles -->
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <!-- Diamond SVG icon (inline, no external dependencies) -->
        <div class="diamond-container">
            <svg class="diamond-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Diamond shape -->
                <polygon points="50,8 90,38 50,92 10,38"
                         fill="url(#diamond-gradient)"
                         stroke="url(#diamond-stroke)" stroke-width="1.5"/>
                <!-- Inner facets -->
                <line x1="50" y1="8" x2="30" y2="38" stroke="rgba(245,230,163,0.3)" stroke-width="0.8"/>
                <line x1="50" y1="8" x2="70" y2="38" stroke="rgba(245,230,163,0.3)" stroke-width="0.8"/>
                <line x1="10" y1="38" x2="90" y2="38" stroke="rgba(245,230,163,0.3)" stroke-width="0.8"/>
                <line x1="30" y1="38" x2="50" y2="92" stroke="rgba(245,230,163,0.2)" stroke-width="0.5"/>
                <line x1="70" y1="38" x2="50" y2="92" stroke="rgba(245,230,163,0.2)" stroke-width="0.5"/>
                <line x1="50" y1="38" x2="50" y2="92" stroke="rgba(245,230,163,0.15)" stroke-width="0.5"/>
                <!-- Sparkle highlight -->
                <circle cx="42" cy="30" r="2" fill="rgba(255,255,255,0.6)">
                    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
                </circle>
                <defs>
                    <linearGradient id="diamond-gradient" x1="10" y1="8" x2="90" y2="92" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#f5e6a3"/>
                        <stop offset="40%" stop-color="#d4af37"/>
                        <stop offset="70%" stop-color="#b8860b"/>
                        <stop offset="100%" stop-color="#8a6914"/>
                    </linearGradient>
                    <linearGradient id="diamond-stroke" x1="10" y1="8" x2="90" y2="92" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#f5e6a3"/>
                        <stop offset="100%" stop-color="#d4af37"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <h1>We'll Be Right Back</h1>
        <div class="subtitle">Scheduled Maintenance</div>

        <div class="ornament">
            <span class="ornament-line"></span>
            <span class="ornament-dot"></span>
            <span class="ornament-line"></span>
        </div>

        <p class="message">
            We're polishing things behind the scenes to serve you better.
            Our system will be back online shortly — thank you for your patience.
        </p>

        <div class="progress-container">
            <div class="progress-dots">
                <span class="progress-dot"></span>
                <span class="progress-dot"></span>
                <span class="progress-dot"></span>
            </div>
            <span class="progress-text">Upgrade in progress</span>
        </div>

        <div class="footer">
            <p>If this persists, contact <a href="mailto:support@logimaxindia.com">support@logimaxindia.com</a></p>
        </div>
    </div>
</body>
</html>
